name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Web (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Playwright suite (web/e2e) against the real server in fake mode (fake GitHub, Claude CLI and
    # sandboxes). web/e2e/server.mjs builds the server (installDist) and the frontend itself and creates
    # a fresh database per run in this PostgreSQL service, through psql on the runner.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      E2E_PG_CONTAINER_CMD: env PGHOST=localhost PGPORT=5432 PGPASSWORD=factory
      E2E_DB_HOST: localhost
      E2E_DB_HOST_PORT: "5432"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Headless runs use Chromium's headless shell; the system libraries are installed every time
      # (apt), the browser itself only on a cache miss.
      - name: Install Chromium (headless shell)
        run: npx playwright install --with-deps --only-shell chromium
      # One worker: the specs share one server and build on each other's state (playwright.config.ts).
      - name: Run the e2e suite
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  server:
    name: Server (build and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The tests start their own embedded PostgreSQL (io.zonky embedded-postgres) and use fakes
      # for GitHub, git and the Claude CLI, so no database service is needed.
      - run: ./gradlew --no-daemon build

  packaging:
    name: Packaging scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck packaging/agern packaging/install.sh scripts/*.sh \
            packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm packaging/deb/smoke-test.sh \
            packaging/deb/sandbox-host-test.sh packaging/deb/sandbox-service \
            server/src/main/resources/sandbox/prepare-user.sh

  migrations:
    name: Database migrations (versions)
    runs-on: ubuntu-latest
    steps:
      # On a pull request the checkout is its merge result: HEAD^1 is the tip of the base branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: scripts/check-migrations-test.sh
      - name: Check the migrations
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            scripts/check-migrations.sh HEAD^1
          else
            scripts/check-migrations.sh
          fi

  deb:
    name: Debian package (build)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: the main-build version is derived from the latest release tag
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: version
        run: echo "version=$(scripts/main-version.sh)" >> "$GITHUB_OUTPUT"
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: scripts/package.sh --deb "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/release/agern_${{ steps.version.outputs.version }}_all.deb
          if-no-files-found: error
          retention-days: 7

  deb-smoke:
    name: Debian package (install smoke test, ${{ matrix.image }})
    needs: deb
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      # A clean container per distribution: apt resolves the dependencies, then install, upgrade,
      # rollback, the server against native PostgreSQL, automatic upgrade, remove and purge.
      - name: Smoke test
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.deb.outputs.version }}
        run: |
          docker run --rm -v "$PWD":/src:ro "$IMAGE" \
            bash /src/packaging/deb/smoke-test.sh "/src/dist/agern_${VERSION}_all.deb" --server

  sandbox:
    name: Sandboxes (rootless Podman under systemd, Ubuntu 24.04 VM)
    needs: deb
    # A hosted runner is a VM with systemd, sudo and a real kernel: the package, its units and
    # rootless Podman run as they do on a server. Debian 12/13 need a VM of their own: run the same
    # script there by hand (docs/INSTALL-LINUX.md, "Sandboxes").
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      # The integration test runs Gradle as the agern user inside agern.service, offline: resolve
      # everything it needs here first (the same task selection; without AGERN_PODMAN_IT its tests skip),
      # into the runner's ~/.gradle, which setup-gradle caches between runs. The host test seeds the
      # agern user's Gradle home from it and runs that Gradle with --offline.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The only step that may download. Maven Central sometimes answers 429/404 to hosted runners:
      # up to 4 attempts, 30/60/120 s apart, the last with --refresh-dependencies (past a cached 404).
      - name: Resolve Gradle dependencies (for the offline run as agern)
        run: |
          cmd=(./gradlew --no-daemon :server:test --tests dk.egernet.factory.PodmanIntegrationTest)
          delays=(30 60 120)
          for attempt in 1 2 3 4; do
            extra=()
            [ "$attempt" -eq 4 ] && extra=(--refresh-dependencies)
            if "${cmd[@]}" "${extra[@]}"; then exit 0; fi
            [ "$attempt" -eq 4 ] && break
            echo "Gradle attempt $attempt failed; retrying in ${delays[$((attempt - 1))]}s"
            sleep "${delays[$((attempt - 1))]}"
          done
          echo "Gradle failed after 4 attempts" >&2
          exit 1
      # Installs the package, PostgreSQL and Podman with apt; 'agern sandbox enable' and its
      # self-test; doctor; the server under the hardened unit reaping a leftover sandbox through the
      # socket; PodmanIntegrationTest as the agern user inside agern.service; upgrade, prune,
      # disable, purge. Prints PASS/FAIL per check and fails the job on any FAIL.
      - name: Sandbox host test
        env:
          VERSION: ${{ needs.deb.outputs.version }}
        run: sudo AGERN_IT_GRADLE_CACHE="$HOME/.gradle" bash packaging/deb/sandbox-host-test.sh "dist/agern_${VERSION}_all.deb" --it .

  publish-main:
    name: Publish the rolling main pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, e2e, server, packaging, migrations, deb, deb-smoke, sandbox]
    runs-on: ubuntu-latest
    permissions:
      contents: write # move the main-latest tag and update its release assets
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - name: Publish main-latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.deb.outputs.version }}
        run: |
          set -euo pipefail
          # Only the newest commit on main is published: a slower run of an older commit stops here.
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is now at $head, not $GITHUB_SHA; not publishing"
            exit 0
          fi
          deb="agern_${VERSION}_all.deb"
          (cd dist && sha256sum "$deb" > SHA256SUMS)
          git tag -f main-latest "$GITHUB_SHA"
          git push -f origin refs/tags/main-latest
          notes="Rolling build of main (${GITHUB_SHA}), version ${VERSION}. Replaced on every push to main; for 'agern upgrade --channel main' and 'agern auto-upgrade on --channel main'. Not a release."
          if gh release view main-latest >/dev/null 2>&1; then
            gh release edit main-latest --prerelease --latest=false --title "Agern main (rolling)" --notes "$notes"
          else
            gh release create main-latest --verify-tag --prerelease --latest=false --title "Agern main (rolling)" --notes "$notes"
          fi
          # New package first, then the checksums that point at it, then drop the old packages.
          gh release upload main-latest "dist/$deb" --clobber
          gh release upload main-latest dist/SHA256SUMS --clobber
          gh release view main-latest --json assets --jq '.assets[].name' |
            { grep -E '^agern_.*_all\.deb$' || true; } | { grep -vxF "$deb" || true; } |
            while read -r old; do gh release delete-asset main-latest "$old" --yes; done
