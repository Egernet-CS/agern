name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload its assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::tag $TAG is not v<semantic version>"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Frontend checks
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci
          npm run typecheck
          npm run lint

      - name: Server tests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon build -Pversion="$VERSION"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: scripts/package.sh "$VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=()
          case $VERSION in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" \
            --verify-tag \
            --title "Agern $VERSION" \
            --generate-notes \
            "${prerelease[@]}" \
            "build/release/agern-$VERSION.tar.gz" \
            build/release/install.sh \
            build/release/SHA256SUMS
