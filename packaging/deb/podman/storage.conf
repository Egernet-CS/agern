# Podman storage of agern-sandbox.service (CONTAINERS_STORAGE_CONF; installed by the agern .deb as
# /usr/share/agern/podman/storage.conf): images, containers and volumes of the agern user under
# the data directory, in one place that 'agern sandbox status' and 'agern doctor' can measure.
[storage]
driver = "overlay"
graphroot = "/var/lib/agern/containers/storage"
rootless_storage_path = "/var/lib/agern/containers/storage"
