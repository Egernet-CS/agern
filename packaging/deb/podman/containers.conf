# Podman engine configuration of agern-sandbox.service (CONTAINERS_CONF; installed by the agern
# .deb as /usr/share/agern/podman/containers.conf). With CONTAINERS_CONF set, Podman reads this
# file instead of /etc/containers/containers.conf and ~/.config/containers/containers.conf.

[containers]
# Logs stay with the container and go with it (the server reads command output through exec).
log_driver = "k8s-file"

[engine]
# No systemd user session exists for the agern user (no lingering): cgroups are created directly
# in the unit's delegated cgroup (FACTORY_SANDBOX_CGROUP_PARENT) instead of through systemd.
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"

[network]
# netavark with aardvark-dns: containers on a run's network reach each other by name.
network_backend = "netavark"
