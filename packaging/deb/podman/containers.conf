# Podman engine configuration of agern-sandbox.service (CONTAINERS_CONF; installed by the agern
# .deb as /usr/share/agern/podman/containers.conf). With CONTAINERS_CONF set, Podman reads this
# file instead of /etc/containers/containers.conf and ~/.config/containers/containers.conf.

[containers]
# Logs stay with the container and go with it (the server reads command output through exec).
log_driver = "k8s-file"

[engine]
# No systemd user session exists for the agern user (no lingering): cgroups are created directly
# in the unit's delegated cgroup (FACTORY_SANDBOX_CGROUP_PARENT) instead of through systemd.
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"

[network]
# netavark with aardvark-dns: containers on a run's network reach each other by name.
network_backend = "netavark"
# The rootless network namespace (outbound traffic of the run networks) through slirp4netns, not
# pasta. Podman 5 (Debian 13) would use pasta, whose AppArmor profile there lets it write only
# under /run/user/<uid> and /tmp — not this service's runtime directory /run/agern-sandbox — and
# has no local/ include to extend it; the container then fails with "setting up Pasta … Permission
# denied". slirp4netns's profile is unconfined (it sandboxes itself with seccomp and a mount
# namespace). Podman 4.3 (Debian 12) does not know this key and ignores it; 4.3 and 4.9 use
# slirp4netns already, so for them nothing changes.
default_rootless_network_cmd = "slirp4netns"
